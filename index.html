<!DOCTYPE html>
<html lang="zh-TW" data-cssv="83">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逢甲大學建設碩士在職學位學程｜第十屆同學看板</title>
<meta name="theme-color" content="#7D212A">
<link rel="apple-touch-icon" href="assets/mcd-logo.png">
<meta name="apple-mobile-web-app-title" content="建設碩士在職學位學程">
<style>
/* ── 配色 ────────────────────────────────────────────────────────
   主色＝逢甲大學校色深紅 #7D212A（2026-08-29 取自 fcu.edu.tw 官網，
   全站用了 58 次的主導色；輔色 #AA2D39、#B7505F 也是官網既有的）。

   三個組的分類色改取學程 logo（那個彩色積木大樓）的紫／藍／綠 ——
   跟校色深紅拉得開，一眼分得出組別。
   橘 #F39800 只留給「要按下去的東西」與幹部標記，是全站唯一的醒目色。

   ⛔ 不要自己另外配色。深紅是學校的、積木色是學程的，
      換掉就沒有辨識度了。                                          */
:root{
  --p-900:#5C1720; --p-700:#7D212A; --p-500:#AA2D39; --p-300:#B7505F;
  --c-sky:#05B5ED; --c-orange:#F39800; --c-yellow:#FFF100;
  --c-purple:#601986; --c-green:#93C529; --c-red:#D01027;

  --bg:#f7f2f3; --card:#ffffff; --text:#1e1719; --muted:#6b5c5f;
  --line:#ece3e4; --line-soft:#f5eeef;
  --chip:#f7ecee; --chip-text:#7D212A;
  --ok:#1a7f4b; --warn:#b4531a;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(45,20,24,.05), 0 4px 14px rgba(45,20,24,.07);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ── 頂欄 ───────────────────────────── */
.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--p-900) 0%,var(--p-700) 55%,var(--p-500) 100%);
  color:#fff; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:11px;
}
.top .burger{background:none;border:none;color:#fff;padding:6px;margin:-6px;cursor:pointer;display:flex}
.top .logo{width:36px;height:36px;border-radius:9px;flex:none;object-fit:contain;background:#fff;padding:4px 3px}
.top h1{font-size:.88rem;font-weight:800;letter-spacing:.2px;line-height:1.3}
.top .sub{font-size:.7rem;opacity:.85;font-weight:400}
.top .me{margin-left:auto;display:flex;align-items:center;gap:7px;background:#ffffff26;
  padding:6px 11px;border-radius:999px;font-size:.8rem;font-weight:600;min-height:36px;border:none;cursor:pointer;color:#fff}
.top .me .dot{width:7px;height:7px;border-radius:50%;background:#9aa4b2}
.top .me.in .dot{background:#5fe0a0}

/* ⚠️ 版心寬度：純文字頁 760 是好讀的上限，但名冊是網格，
   760 會逼成又擠又高的卡片。所以文字頁 880、名冊另外放寬。 */
.wrap{max-width:880px;margin:0 auto;padding:14px 14px 26px}
.view{display:none} .view.on{display:block}

/* ── 主視覺 ─────────────────────────── */
.hero{position:relative;margin:-14px -14px 16px;height:210px;overflow:hidden;
  display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 深紅 duotone：照片壓成校色，才不會每張照片各自為政 */
.hero .tint{position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(92,23,32,.88),rgba(125,33,42,.62) 52%,rgba(170,45,57,.42))}
.hero .txt{position:relative;padding:16px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .kicker{font-size:.72rem;letter-spacing:2.5px;font-weight:700;opacity:.9}
.hero h2{font-size:1.5rem;font-weight:800;line-height:1.3;margin-top:4px}
.hero .line{font-size:.82rem;opacity:.92;margin-top:5px}
.hero .blocks{position:absolute;right:12px;top:12px;display:flex;gap:3px}
.hero .blocks i{width:9px;height:9px;border-radius:2px;display:block}

/* ── 區塊標題 ───────────────────────── */
.sec{display:flex;align-items:baseline;gap:9px;margin:22px 2px 10px}
.sec:first-child{margin-top:4px}
.sec h2{font-size:1.0rem;font-weight:800;letter-spacing:.3px}
.sec .more{margin-left:auto;font-size:.82rem;color:var(--p-500);font-weight:600;
  background:none;border:none;cursor:pointer;min-height:38px}

/* ── 卡片 ───────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:10px}
.card.pad{padding:14px 16px}
.bigcard .band{background:linear-gradient(135deg,var(--p-900),var(--p-500));color:#fff;padding:14px 16px}
.bigcard .band .kicker{font-size:.7rem;opacity:.85;letter-spacing:1.5px;font-weight:700}
.bigcard .band .t{font-size:1.15rem;font-weight:800;margin-top:3px;line-height:1.4}
.bigcard .body{padding:14px 16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;min-height:46px;border:none;border-radius:var(--r-sm);font-weight:700;font-size:.92rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--c-orange);color:#fff}
.btn-primary:hover{background:#d9880a}
.btn-ghost{background:transparent;color:var(--p-500);border:1.5px solid var(--line)}
.btn-done{background:var(--chip);color:var(--muted);cursor:default}
.btn-checkin{background:var(--ok);color:#fff}
.btn-line{background:#06C755;color:#fff;text-decoration:none}
.btn-line:hover{background:#05a948}
.btn-sm{flex:none;min-height:38px;padding:0 14px;font-size:.85rem}
.seatline{margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:.88rem;color:var(--muted)}
.seatline b{color:var(--c-orange);font-weight:800;font-size:1.05rem}
.seatline.full{color:var(--warn);font-weight:700}
.myorder{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:var(--r-sm);font-size:.88rem}
.myorder b{color:var(--p-700)}

/* ── 標籤 ───────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-text)}
.pill.solid{color:#fff}
.pill.warn{background:#fdece4;color:var(--warn)}
.pill.ok{background:#e6f5ec;color:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:5px}

/* ── 工具列 / 篩選 ──────────────────── */
.tools{margin-bottom:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:0 12px;margin-bottom:9px}
.search input{flex:1;border:none;outline:none;background:none;min-height:44px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:0 15px;min-height:40px;display:inline-flex;align-items:center;gap:4px;
  font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p-700);color:#fff;border-color:var(--p-700)}

/* ── 同學卡 ─────────────────────────── */
/* ⚠️ 固定三欄，不用 auto-fill。
   auto-fill 在 760px 版心裡會塞成四欄，每張卡只剩 ~170px，
   公司名幾乎每一個都斷行（「太子建設開發股份有／限公司」），
   讀起來比資訊少還糟。三欄 + 名冊頁加寬才夠放一行公司名。 */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:.15s;
  position:relative;display:flex;flex-direction:column}
/* 第一行：頭像與姓名橫排；右上角留給職務標籤。
   ⛔ 單位【不要】擠到右半邊 —— 卡片再切一半，
      「睦聚地產開發有限公司」會斷成三行，比沒有還難看。 */
.mtop{display:flex;align-items:center;gap:10px;padding-right:52px;min-height:44px}
.mtop .ava{margin:0;flex:none;width:44px;height:44px;font-size:.95rem}
.mname{min-width:0}
.mcard .c.blank{color:var(--p-300);font-weight:600}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,20,24,.13)}
.ava{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;
  font-weight:800;font-size:1.15rem;color:#fff;background:var(--p-500)}
.ava.lg{width:76px;height:76px;font-size:1.5rem}
.mcard .n{font-weight:800;font-size:1rem;line-height:1.3}
.mcard .nick{font-size:.75rem;font-weight:600;color:var(--muted);margin-top:1px}
.mcard .c{font-size:.82rem;color:var(--muted);margin-top:10px;line-height:1.65}
/* 第二、三個身分：淡一階，一眼看得出主次，但不會小到看不清楚 */
.mcard .org + .org{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.mcard .org.alt{opacity:.78}
/* 職稱：跟在單位後面同一段流動，用字重與顏色區分，不靠換行 */
.mcard .org span{color:var(--text);font-weight:700;white-space:nowrap}
/* ⛔ 不要用 margin-top:auto 把標籤壓到卡片底部 ——
   卡片高度不一時，資料少的人中間會空出一大塊，看起來像壞掉。
   讓內容自然往下接，格子改成不拉齊高度（align-items:start）。 */
.mcard .pills{margin-top:10px;justify-content:flex-start}
.mcard .of{position:absolute;top:8px;right:8px;font-size:.66rem;font-weight:800;
  background:var(--c-orange);color:#fff;padding:2px 7px;border-radius:999px}
.mcard.dim{opacity:.62}
.mcard .c.locked{color:var(--p-300);font-weight:600}
.locked{color:var(--p-300);font-weight:600}
/* 未登入時解釋「為什麼只看得到名字」。不解釋的話，同學會以為資料沒建好 */
.notice-lock{background:var(--chip);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 13px;font-size:.85rem;line-height:1.7;color:var(--muted);margin-bottom:10px}
.notice-lock b{color:var(--p-700)}
.gdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}

/* ── 詳細頁 ─────────────────────────── */
.backbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.backbar button{background:none;border:none;color:var(--p-500);font-weight:700;font-size:.9rem;
  cursor:pointer;display:flex;align-items:center;gap:4px;min-height:40px;padding:0}
.detail h3{font-size:1.2rem;font-weight:800;line-height:1.4}
.detail .bodytext{margin-top:10px;white-space:pre-wrap;font-size:1rem;line-height:1.85}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem;margin-top:12px}
.kv dt{color:var(--muted);font-weight:600;white-space:nowrap}
.block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.block h4{font-size:.86rem;font-weight:800;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}

/* ── 相簿 ───────────────────────────── */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acard{border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:4/3;cursor:pointer;
  box-shadow:var(--shadow)}
.acard img{width:100%;height:100%;object-fit:cover}
.acard .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:.85rem;font-weight:700}
.acard .cap span{display:block;font-size:.72rem;font-weight:500;opacity:.85}

/* ── 空狀態 ─────────────────────────── */
.empty{color:var(--muted);font-size:.88rem;padding:22px 18px;line-height:1.8;
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:.98rem;margin-bottom:5px}

/* ── 抽屜 ───────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(20,10,30,.45);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(78vw,300px);background:var(--card);
  z-index:61;transform:translateX(-100%);transition:transform .22s;overflow-y:auto;
  box-shadow:4px 0 24px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawerhead{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line);
  padding-top:calc(16px + env(safe-area-inset-top))}
.drawerhead img{width:40px;height:40px;object-fit:contain}
.drawerhead .sub{font-size:.74rem;color:var(--muted)}
.drawerhead b{font-size:.86rem;line-height:1.35;display:block}
.drawerx{margin-left:auto;background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer;line-height:1}
.drawer a.di{display:flex;align-items:center;gap:11px;padding:13px 16px;font-size:.94rem;
  font-weight:600;border-bottom:1px solid var(--line-soft);cursor:pointer}
.drawer a.di.on{color:var(--p-700);background:var(--chip)}
.drawer .dgroup{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:1px;
  padding:14px 16px 6px}

/* ── 底部導覽 ───────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);
  border-top:1px solid var(--line);display:flex;height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom)}
.nav .brand{display:none}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:.6rem;font-weight:700;
  letter-spacing:-.3px;padding:0 2px;text-align:center;line-height:1.15;
  color:var(--muted);cursor:pointer;position:relative}
.nav button.on{color:var(--p-700)}
.nav button .ic{stroke:currentColor;fill:none}
.nav button .dot{position:absolute;top:8px;right:calc(50% - 18px);width:7px;height:7px;
  border-radius:50%;background:var(--c-red);display:none}
.nav button.hasnew .dot{display:block}
.deskonly{display:none}
.navlg{display:none}.navsm{display:inline}
/* 資源交流加一顆星：這是最想讓人用、也最容易被略過的一項。
   ⛔ 原本做成整顆金框，太搶戲 —— 導覽列的重點是找路，不是打廣告。
      一顆星就夠了。也只給這一個，兩顆以上就沒有意義。 */
.navstar{color:#C9A227;font-size:.7em;margin-left:3px;vertical-align:super;line-height:1}
/* 分頁列：合併後的群組用這排切換子頁 */
.subtabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  /* ⚠️ overflow-x:auto 會把 y 也變成 auto。分頁鈕有 margin-bottom:-1px 蓋住底線，
     那 1px 就足以讓瀏覽器長出一條垂直捲軸 —— 明確關掉 y。 */
  overflow-y:hidden}
.subtabs{align-items:center}
.subtabs .tb{border:0;background:none;padding:9px 14px 10px;font:inherit;font-size:.92rem;
  font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;margin-bottom:-1px}
.subtabs .tb.on{color:var(--p-700);border-bottom-color:var(--p-500)}
.subtabs .tb:hover{color:var(--ink)}
/* 被吸收進來的說明字與動作鈕靠右站 */
.subtabs .tabhint{margin-left:auto;padding-left:10px;white-space:nowrap}
.subtabs .more{margin-left:auto;padding:0 2px 0 10px;white-space:nowrap}
.subtabs .tabhint + .more{margin-left:0}
@media(max-width:600px){.subtabs .tabhint{display:none}}

/* ── 表單 ───────────────────────────── */
.field{margin-bottom:12px}
.field label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:11px 12px;background:var(--card);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--p-500)}
.field textarea{min-height:110px;resize:vertical;line-height:1.7}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.7}

/* ── 燈箱 ───────────────────────────── */
/* 表單彈窗（提需求／發活動／建相簿共用一組） */
.formwrap{position:fixed;inset:0;background:rgba(20,8,12,.55);z-index:95;display:none;
  align-items:flex-end;justify-content:center;padding:0}
.formwrap.on{display:flex}
.formbox{background:var(--card);width:100%;max-width:560px;max-height:92vh;display:flex;
  flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.formhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;
  border-bottom:1px solid var(--line)}
.formhead h3{font-size:1.02rem}
.formhead button{background:none;border:0;font-size:1.4rem;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
#formbody{padding:16px 18px;overflow-y:auto;flex:1}
.ffield{margin-bottom:14px}
.ffield label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.ffield .freq{color:var(--c-red);font-weight:500;font-size:.72rem}
.ffield input[type=text],.ffield input[type=date],.ffield input[type=number],
.ffield input[type=datetime-local],.ffield textarea,.ffield select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink)}
.ffield textarea{resize:vertical;line-height:1.6}
.ffield input:focus,.ffield textarea:focus,.ffield select:focus{
  outline:none;border-color:var(--p-500);background:var(--card)}
.ffield .hint{margin-top:5px}
.fcheck{display:flex!important;align-items:center;gap:8px;font-weight:500!important;
  color:var(--ink)!important;font-size:.9rem!important;cursor:pointer}
.fcheck input{width:17px;height:17px;accent-color:var(--p-500)}
.formfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.formfoot .grow{flex:1}
#formerr{margin:0 18px 12px;padding:9px 12px;border-radius:9px;font-size:.85rem;
  background:#fdeaec;color:var(--c-red);border:1px solid #f5c6cb}
@media(min-width:640px){.formwrap{align-items:center}.formbox{border-radius:16px}}
/* 相簿沒有封面時的色塊 */
/* 停課那一天原本的課，直接接在該條休假資訊底下 */
/* 課程配當表：照手冊做成表格，兩欄並排（窄畫面收成一欄） */
.allocwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alloctable{width:100%;border-collapse:collapse;font-size:.82rem;
  border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.alloctable th,.alloctable td{padding:6px 9px;border:1px solid var(--line);text-align:left}
.alloctable .at{background:var(--p-700);color:#fff;text-align:center;font-size:.88rem;
  letter-spacing:.5px;border-color:var(--p-700)}
.alloctable .ah{background:var(--chip);color:var(--p-700);font-weight:800;font-size:.78rem}
.alloctable .cr{text-align:center;width:52px;font-variant-numeric:tabular-nums}
.alloctable td{background:var(--card)}
@media(max-width:700px){.allocwrap{grid-template-columns:1fr}}
.oncls{display:block;margin-top:3px;font-size:.8rem;color:var(--muted);line-height:1.6}
.oncls b{color:var(--ink);font-weight:700}
.pill.role{background:var(--c-orange);color:#fff;border-color:transparent;font-weight:800}
.pill.open{background:#e7f5ec;color:#1c7a45;border-color:#bde2ca}
.acorner{position:absolute;top:6px;left:6px;z-index:2}
.acover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:2rem;background:linear-gradient(140deg,var(--p-300),var(--p-700))}
.acard a{display:block;width:100%;height:100%;color:inherit;text-decoration:none}
.aedit{position:absolute;top:6px;right:6px;z-index:2;background:rgba(255,255,255,.92);
  border:0;border-radius:6px;padding:3px 9px;font-size:.74rem;font-weight:600;
  color:var(--p-700);cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(10,5,15,.92);z-index:90;display:none;
  align-items:center;justify-content:center;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:88vh;border-radius:8px}
.lightx{position:absolute;top:14px;right:16px;background:none;border:none;color:#fff;
  font-size:2rem;cursor:pointer;line-height:1}

/* ── 桌機 ───────────────────────────── */
/* ── 手機（≤520px）───────────────────────────────────────────────
   在職專班的同學九成用手機看，這一段不是「順便相容」，是主要情境。
   ⛔ 不要把桌機的密度直接縮小搬過來 —— 行距、觸控目標、字級都要放大。 */
@media (max-width:520px){
  body{font-size:16px}                     /* ⛔ 不能低於 16px：iOS 聚焦輸入框會自動放大整頁 */
  .wrap{padding:12px 12px 24px}
  .hero{margin:-12px -12px 14px;height:180px}
  .hero h2{font-size:1.28rem}
  .hero .kicker{font-size:.66rem;letter-spacing:1.6px}

  /* 名冊一行兩張，卡片才不會變成一長條 */
  .mgrid{grid-template-columns:1fr 1fr;gap:8px}
  /* 手機一列兩張，寬度只有 ~165px，橫排會把名字擠掉 —— 改成上下堆疊置中 */
  .mcard{padding:12px 10px;text-align:center}
  .mtop{flex-direction:column;gap:5px;padding-right:0;text-align:center;min-height:0}
  .mtop .ava{width:44px;height:44px;font-size:.92rem}
  .mcard .pills{justify-content:center}
  .mcard .c{font-size:.74rem}
  .mcard .head{font-size:.72rem;-webkit-line-clamp:2}

  /* 詳細頁：讀的東西放大，標籤縮小 */
  .detail h3{font-size:1.12rem}
  .detail .bodytext{font-size:1rem;line-height:1.9}
  .headline{font-size:.95rem;padding:11px 12px}

  /* 定義清單在窄螢幕改成上下排，不然標題會被擠成直書 */
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dt{margin-top:8px}
  .kv dt:first-child{margin-top:0}

  /* 行事曆：日期與內容一行放不下就讓標籤掉下來 */
  .calrow{flex-wrap:wrap;padding:10px 12px}
  .calrow .pill{order:3;margin-left:63px}
  .caldate{width:52px}
  .caldate.wide{width:58px}
  .offlist{font-size:.84rem}

  /* 表單：欄位與「給誰看」的選單各佔一行，不要擠在同一行 */
  .field label{flex-wrap:wrap}
  .vissel{margin-left:0;margin-top:2px}

  .creditbar{height:52px}
  .agrid{grid-template-columns:1fr 1fr;gap:8px}
  .actions{flex-wrap:wrap}
  .btn-sm{flex:1 1 auto}
}

@media (min-width:900px){
  body{padding-bottom:0;padding-left:212px}
  .nav{top:0;right:auto;width:212px;height:100vh;flex-direction:column;
    border-top:none;border-right:1px solid var(--line);padding:0 0 20px;overflow-y:auto}
  /* ⚠️ mcd-logo.png 原本上下各留 12px 透明邊（90x90 裡只有 65px 是圖），
     60px 的框看起來空一大塊。圖已裁成 90x65，高度改用 auto 讓它照原比例。 */
  .nav .brand{display:block;text-align:center;padding:14px 12px 12px;border-bottom:1px solid var(--line-soft)}
  .nav .brand img{width:76px;height:auto;object-fit:contain;display:block;margin:0 auto}
  .nav .brandname{font-size:.8rem;font-weight:800;color:var(--p-700);margin-top:8px;line-height:1.45}
  .nav .brandname span{display:block;font-size:.68rem;font-weight:500;color:var(--muted)}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;
    letter-spacing:0;text-align:left;
    padding:13px 20px;font-size:.9rem;height:auto}
  .nav button.on{background:var(--chip)}
  .nav button .dot{top:14px;right:auto;left:12px}
  .top .burger{display:none}
  .deskonly{display:flex}
  .navlg{display:inline}.navsm{display:none}
  .hero{height:270px}
  /* 名冊是網格，比純文字頁需要更多寬度 */
  #v-members{max-width:1180px}
  #v-members .hero{margin-left:-14px;margin-right:-14px}
}
/* ── 行事曆 ─────────────────────────── */
.calrow{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;
  border-bottom:1px solid var(--line-soft)}
.calrow:last-child{border-bottom:none}
.calrow.past{opacity:.45}
.calrow.next{background:var(--chip)}
.caldate{flex:none;width:52px;text-align:center;line-height:1.25}
.caldate.wide{width:66px}
.offlist{margin:0;padding-left:17px;font-size:.86rem;line-height:1.7}
.offlist li{margin:2px 0}
.caldate b{display:block;font-size:.92rem;font-weight:800}
.caldate span{font-size:.68rem;color:var(--muted)}
.calbody{flex:1;min-width:0}
.caltext{font-size:.9rem;line-height:1.5}
/* 學分條：必修 2 / 選修 30 的比例直接畫出來，比寫「2+30」好懂 */
.creditbar{display:flex;gap:3px;height:46px;border-radius:var(--r-sm);overflow:hidden}
.cseg{display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;line-height:1.15;min-width:44px}
.cseg b{font-size:1.05rem;font-weight:800}
.cseg span{font-size:.66rem;opacity:.9}
.cseg.req{background:var(--p-700)}
.cseg.ele{background:var(--p-300)}
.numlist{padding-left:20px;font-size:.92rem;line-height:1.75}
.numlist li{margin:5px 0}
/* 課程地圖：欄多字長，用橫向捲動而不是硬擠 */
.maptable{overflow-x:auto;-webkit-overflow-scrolling:touch}
.maptable table{border-collapse:collapse;font-size:.78rem;min-width:620px}
.maptable th,.maptable td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.maptable th{background:var(--chip);font-weight:700;white-space:nowrap}
.maptable .rowlab{background:var(--card);max-width:120px;white-space:normal}
.maptable td div{margin:2px 0;line-height:1.5}
/* ── 週曆 ───────────────────────────
   ⚠️ 一定要能橫向捲動：五欄課表在手機上塞不下，
      硬擠只會讓每個課名斷成一個字一行。 */
.weekwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.week{border-collapse:collapse;width:100%;min-width:640px;font-size:.78rem}
.week th,.week td{border:1px solid var(--line);vertical-align:top;padding:6px}
.week th{background:var(--chip);color:var(--chip-text);font-weight:800;text-align:center}
.week .tcorner{width:92px;background:var(--card)}
.week .tslot{width:92px;background:var(--card);color:var(--muted);font-weight:700;
  font-size:.72rem;line-height:1.45;text-align:center}
/* 節次擺在時間上面：學校公告（加退選、教室調動、補課）一律講節次，
   只寫時間對不起來 */
.week .tslot .pnum{display:block;color:var(--p-700);font-size:.7rem;
  font-weight:800;margin-bottom:2px}
.week td{min-width:112px}
.wcls{border-left:3px solid var(--p-500);background:var(--line-soft);
  border-radius:6px;padding:6px 8px;line-height:1.45}
.wcls + .wcls{margin-top:5px}
.wcls b{display:block;font-size:.79rem;font-weight:700;color:var(--text)}
.wcls .wt{display:block;font-size:.7rem;color:var(--muted);margin-top:2px}
.wcls .wtag{display:inline-block;font-size:.64rem;font-weight:800;color:var(--warn);
  background:#fdece4;border-radius:999px;padding:0 6px;margin-top:3px}
.wcls.req{background:#fff6e5;border-left-color:var(--c-orange)}
/* ── 師資 ─────────────────────────── */
.fcard + .fcard{margin-top:8px}
.frow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.fname b{font-size:1rem;font-weight:800}
.fname span{font-size:.78rem;color:var(--muted);margin-left:6px}
.fcontact{margin-left:auto;text-align:right;font-size:.76rem;color:var(--muted);line-height:1.6}
.fcontact a{color:var(--p-500);font-weight:600;word-break:break-all}
.ffield{margin-top:7px;font-size:.86rem;line-height:1.7}
/* 有個人頁的用主色，只能搜尋的用灰 —— 一眼看得出點下去會拿到什麼 */
.flink{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:700;color:var(--muted)}
.flink.has{color:var(--p-500)}
@media (max-width:520px){
  .fcontact{margin-left:0;text-align:left;width:100%}
}
.linkrow{display:flex;align-items:center;gap:10px;padding:13px 15px;font-size:.9rem;
  font-weight:600;border-bottom:1px solid var(--line-soft);cursor:pointer}
.linkrow:last-child{border-bottom:none}
.linkrow:hover{background:var(--chip)}
.linkrow .go{margin-left:auto;color:var(--p-500);font-weight:800}
/* ── 幹部職務 ──────────────────────── */
.offrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid var(--line-soft)}
.offrow:last-child{border-bottom:none}
.offrow:hover{background:var(--chip)}
.offbadge{flex:none;min-width:72px;text-align:center;font-size:.72rem;font-weight:800;
  color:#fff;background:var(--c-orange);border-radius:999px;padding:4px 8px;line-height:1.4}
.offbody{min-width:0}
.offname{font-weight:800;font-size:.95rem;margin-bottom:2px}
/* 職務說明與人名分成兩塊：先知道該找哪個職務，再去找人。
   兩欄排 —— 十二列一路往下拉，首頁會長到看不到底下的東西。 */
/* 招募下一任幹部的那句話。用淡底色跟上面的說明分開 ——
   混在灰色小字裡沒人會讀到，那句話就白寫了。 */
.joinnote{background:#fff6e5;border:1px solid #f3dcb0;border-radius:var(--r-sm);
  padding:10px 13px;margin-bottom:12px;font-size:.85rem;line-height:1.75;color:var(--ink)}
.joinnote b{color:var(--p-700)}
.dutygrid,.offgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.duty{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.duty .offbadge{margin-top:1px}
.offcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.offcard:hover{background:var(--chip);border-color:var(--p-300)}
.offcard .ava{width:36px;height:36px;font-size:.82rem;margin:0;flex:none}
.offcard .offname{font-weight:800;font-size:.94rem}
.offcard .offrole{font-size:.76rem;color:var(--p-500);font-weight:700;margin-top:1px}
@media(max-width:900px){.dutygrid,.offgrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.dutygrid,.offgrid{grid-template-columns:1fr}}
.offnote{margin-top:12px;padding:10px 12px;background:#fff6e5;border-radius:var(--r-sm);
  font-size:.86rem;line-height:1.7}
.offnote b{color:var(--warn)}
@media (max-width:520px){
  .offrow{flex-direction:column;gap:5px}
  .offbadge{min-width:0;align-self:flex-start;padding:3px 10px}
}
/* 操作步驟收在 details 裡，不然表單會被一大段說明撐開 */
.howto{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
.howto summary{cursor:pointer;padding:9px 12px;font-size:.82rem;font-weight:700;color:var(--p-500);
  list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"▸ "}
.howto[open] summary::before{content:"▾ "}
.howtobody{padding:2px 14px 12px;font-size:.85rem;line-height:1.75}
.howtobody b{display:block;margin:8px 0 4px;color:var(--p-700)}
.howtobody ol{padding-left:20px;margin:0}
.howtobody li{margin:3px 0}
.howtobody code{background:var(--line-soft);padding:1px 5px;border-radius:4px;font-size:.85em;
  word-break:break-all}

/* ── 個人資料 ───────────────────────── */

.mcard .head{font-size:.76rem;color:var(--p-700);line-height:1.6;margin-top:8px;
  font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.headline{margin-top:14px;padding:12px 14px;background:var(--chip);border-radius:var(--r-sm);
  font-size:.95rem;font-weight:700;color:var(--p-700);line-height:1.65}
/* 公開範圍的小標，只有本人看得到自己的 */
.vistag{display:inline-block;font-size:.64rem;font-weight:700;padding:1px 7px;border-radius:999px;
  background:var(--chip);color:var(--chip-text);vertical-align:1px;margin-left:5px}
.vistag.open{background:#fdece4;color:var(--warn)}
.vistag.shut{background:#eceaee;color:var(--muted)}
.field label{display:flex;align-items:center;gap:6px}
.field label .opt{font-size:.68rem;font-weight:600;color:var(--muted);
  background:var(--line-soft);padding:1px 6px;border-radius:999px}
.pairrow{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
@media (max-width:520px){ .pairrow{grid-template-columns:1fr;gap:6px} }
/* ⚠️ 下拉前面一定要有「給誰看」三個字。
   之前只有一個孤零零的下拉寫著「本屆同學」，沒人知道那是什麼 ——
   選單本身不會解釋自己。 */
.vislabel{margin-left:auto;font-size:.7rem;font-weight:600;color:var(--muted)}
.vissel-demo{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;
  background:var(--line-soft);color:var(--muted);font-weight:600}
.vissel{margin-left:6px;width:auto!important;font-size:.72rem!important;padding:3px 6px!important;
  border-radius:999px!important;color:var(--muted);background:var(--line-soft)!important;
  border:none!important;font-weight:600;cursor:pointer}
/* 媒合的關鍵欄位：視覺上要比其他欄重 */
.field.key{background:#fff9f0;border:1px solid #f6e3c8;border-radius:var(--r-sm);padding:11px 12px}
.field.key label{color:var(--warn)}
.qsec{margin-top:6px;padding:2px 14px 8px;background:var(--line-soft);border-radius:var(--r-sm)}

.helpdoc h3{font-size:1.02rem;margin:18px 0 6px}
.helpdoc h3:first-child{margin-top:0}
.helpdoc ul{padding-left:20px;font-size:.92rem}
.helpdoc li{margin:4px 0}
.helpdoc{overflow-x:hidden}
.helpdoc table{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0;
  display:block;overflow-x:auto;white-space:nowrap}
.helpdoc td,.helpdoc th{white-space:normal;min-width:120px}
.helpdoc th,.helpdoc td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.helpdoc th{background:var(--chip);font-weight:700}
.helpdoc code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.85em}
</style>
</head>
